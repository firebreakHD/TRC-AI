name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate app metadata and workflow contract
        run: |
          python -m pip install pyyaml jsonschema openapi-spec-validator playwright "pydantic>=2,<3" "uvicorn>=0.39,<1"
          python tests/validate.py
          PYTHONPATH=trc_ai python tests/network.py
          node --check trc_ai/trc/static/app.js
          bash -n trc_ai/run.sh
          bash -n tests/smoke.sh
      - name: Build Linux amd64 app
        run: docker build --platform linux/amd64 -t trc-ai:0.2.0 trc_ai
      - name: Build the 0.1.0 upgrade fixture
        run: |
          baseline_dir=$(mktemp -d)
          git archive v0.1.0 trc_ai | tar -x -C "$baseline_dir"
          docker build --platform linux/amd64 -t trc-ai:upgrade-fixture "$baseline_dir/trc_ai"
      - name: Chrome, API, migration, knowledge and backup restore
        env:
          TRC_TEST_BROWSER: "1"
          TRC_TEST_BASELINE_IMAGE: trc-ai:upgrade-fixture
        run: |
          python -m playwright install --with-deps chromium
          bash tests/smoke.sh
      - name: Audit Python dependencies installed in image
        run: |
          python -m pip install pip-audit
          python -m pip_audit --require-hashes --disable-pip -r trc_ai/requirements.lock
      - name: Package local HAOS app
        run: git archive --format=zip --output=trc-ai-haos-amd64.zip HEAD trc_ai
      - uses: actions/upload-artifact@v4
        with:
          name: trc-ai-haos-amd64
          path: trc-ai-haos-amd64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trc-ai-haos-amd64
      - name: Publish tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: "\([^"]*\)"$/\1/p' trc_ai/config.yaml)
          test "$TAG" = "v$version"
          git archive --format=zip --output=trc-ai-n8n-contract.zip HEAD contracts docs/N8N_INTEGRATION.md
          unzip -tq trc-ai-haos-amd64.zip
          unzip -tq trc-ai-n8n-contract.zip
          sha256sum trc-ai-haos-amd64.zip trc-ai-n8n-contract.zip > SHA256SUMS
          cat > release-notes.md <<NOTES
          Entwicklungsfassung für HAOS amd64 mit Dokument-Worker, OCR, Docling, Wissenssuche, Control Center und kompatibler Workflow-API.

          - \`trc-ai-haos-amd64.zip\` enthält den vollständigen Quellordner für ein lokales HAOS-Add-on mit Dockerfile und gesperrten Abhängigkeiten. Das vorhandene Ollama wird über die interne Adresse eingebunden.
          - \`trc-ai-n8n-contract.zip\` enthält OpenAPI, Vertrag, Beispiel und n8n-Anleitung.
          - \`SHA256SUMS\` enthält die Prüfsummen beider ZIP-Dateien.

          [Installation](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/INSTALLATION.md) · [Testbericht](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/TEST_REPORT.md) · [Entwicklungsstand](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/DEVELOPMENT_STATUS.md)
          NOTES
          gh release create "$TAG" --verify-tag --title "TRC-AI $version" --prerelease --notes-file release-notes.md \
            trc-ai-haos-amd64.zip trc-ai-n8n-contract.zip SHA256SUMS
