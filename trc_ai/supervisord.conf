[supervisord]
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:postgresql]
command=postgres -D /data/postgresql/cluster -c listen_addresses='' -k /run/postgresql -c shared_buffers=64MB -c max_connections=20
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/opt/venv/bin/python -m uvicorn trc.app:app --host 0.0.0.0 --port 8099 --no-access-log --no-proxy-headers
user=trc
priority=20
autorestart=true
startsecs=0
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/usr/local/bin/qdrant --config-path /opt/trc/qdrant.yaml
user=qdrant
directory=/data/qdrant
priority=15
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
