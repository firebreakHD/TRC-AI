[supervisord]
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:postgresql]
command=postgres -D /data/postgresql/cluster -c listen_addresses='' -k /run/postgresql -c shared_buffers=%(ENV_TRC_PG_BUFFERS_MB)sMB -c max_connections=20
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/opt/venv/bin/python -m trc.server
user=trc
priority=20
autorestart=true
startsecs=0
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/usr/local/bin/qdrant --config-path /opt/trc/qdrant.yaml
user=qdrant
directory=/data/qdrant
priority=15
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:knowledge-worker]
command=/opt/venv/bin/python -m trc.rag.worker
user=trc
priority=30
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=25
environment=OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
